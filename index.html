<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World indicators</title>
<meta name="description" content="Interactive choropleth world map with a metric switcher, tooltips, pan and zoom, and a country detail panel.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fa;--ink:#14202b;--mute:#5f6c79;--line:#dde2e8;--ocean:#e3ecf2;--nodata:#cdd4db;--stroke:#fff;--chip:#eceff3;--tipbg:#14202b;--tipink:#fff;--sel:#14202b;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1317;--ink:#e9eef3;--mute:#93a0ad;--line:#25303a;--ocean:#131b22;--nodata:#2a343e;--stroke:#0e1317;--chip:#1a232b;--tipbg:#e9eef3;--tipink:#14202b;--sel:#fff}}
:root[data-theme="dark"]{--bg:#0e1317;--ink:#e9eef3;--mute:#93a0ad;--line:#25303a;--ocean:#131b22;--nodata:#2a343e;--stroke:#0e1317;--chip:#1a232b;--tipbg:#e9eef3;--tipink:#14202b;--sel:#fff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:1200px;margin:0 auto;padding:20px 16px 28px}
h1{font-size:26px;line-height:1.1;margin:0 0 4px;letter-spacing:-.02em}
.sub,.mute{color:var(--mute)}
.sub{margin:0 0 16px;font-size:13.5px}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;flex:none;cursor:pointer;white-space:nowrap;padding:8px 0 10px;margin-bottom:-1px;color:var(--mute);font-weight:600;font-size:14px;border-bottom:3px solid transparent;transition:color .2s,border-color .3s}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--c)}
.stage{display:grid;gap:16px}
@media(min-width:900px){.stage{grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}.panel{border-left:1px solid var(--line);padding-left:24px}}
.map-wrap{position:relative;aspect-ratio:960/430;overflow:hidden;border-radius:10px;background:var(--ocean)}
#map{width:100%;height:100%;display:block;cursor:grab}
#map:active{cursor:grabbing}
.ocean{fill:var(--ocean)}
.cs path{fill:var(--nodata);stroke:var(--stroke);stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .55s ease,opacity .25s}
.cs path.dim{opacity:.18}
.hov,.selp{fill:none;stroke:var(--sel);vector-effect:non-scaling-stroke;pointer-events:none}
.hov{stroke-width:1.2;opacity:.65}
.selp{stroke-width:2.4}
.zoom{position:absolute;right:10px;top:10px;display:grid;border-radius:9px;overflow:hidden;background:var(--bg);box-shadow:0 1px 6px #0003}
.zoom button{all:unset;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:18px}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover,.row:hover,.li:hover{background:var(--chip)}
.zoom button:focus-visible,.row:focus-visible,.li:focus-visible,.btn:focus-visible,.lg button:focus-visible,.tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tip{position:absolute;left:0;top:0;z-index:5;pointer-events:none;background:var(--tipbg);color:var(--tipink);padding:8px 11px;border-radius:8px;font-size:12.5px;line-height:1.4;white-space:nowrap;box-shadow:0 6px 18px #0004;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip b{display:block;font-size:13.5px}
.tip span{display:flex;align-items:center;gap:7px;margin-top:2px}
.tip i{width:10px;height:10px;border-radius:3px;flex:none}
.tip em{font-style:normal;opacity:.65}
.msg{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--mute)}
.msg a{color:var(--ink);font-weight:600}
@supports not (aspect-ratio:1){.map-wrap{height:0;padding-top:44.79%}#map{position:absolute;top:0;left:0}}
.legend{padding-top:14px}
.lgh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.lgh em{font-style:normal;color:var(--mute);margin-left:8px;font-size:12.5px}
.nd{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12.5px;white-space:nowrap}
.nd i{width:12px;height:12px;border-radius:3px;background:var(--nodata)}
.lg{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.lg button{all:unset;display:block;cursor:pointer;text-align:center;transition:opacity .2s}
.lg button i{display:block;height:13px;border-radius:3px}
.lg button small{display:block;margin-top:5px;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.lg button.on small{color:var(--ink);font-weight:700}
.lg.f button:not(.on){opacity:.4}
.fade{animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@keyframes grow{from{transform:scaleX(0)}}
.kick{font-size:13px;color:var(--mute)}
.panel h2{font-size:25px;line-height:1.15;margin:2px 0 12px;letter-spacing:-.015em}
.hero{display:flex;align-items:center;gap:12px}
.hero i{width:12px;height:46px;border-radius:4px;flex:none}
.hero b{display:block;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero small{display:block;margin-top:6px;color:var(--mute);font-size:13px}
.scale{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin:20px 0 6px}
.scale i{height:8px;border-radius:2px}
.mk{position:absolute;top:-5px;width:4px;height:18px;border-radius:2px;background:var(--sel);box-shadow:0 0 0 2px var(--bg);transform:translateX(-50%);animation:in .5s ease both}
.scl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}
.sec{margin:22px 0 6px;font-size:13px;font-weight:600;color:var(--mute)}
.row,.li{all:unset;display:grid;width:100%;box-sizing:border-box;padding:7px 8px;border-radius:7px;cursor:pointer}
.row{grid-template-columns:1fr auto;gap:5px 10px}
.row.on{background:var(--chip);box-shadow:inset 3px 0 0 var(--sel)}
.row b,.li b{font-variant-numeric:tabular-nums;font-weight:600}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;border-radius:2px;transform-origin:left;animation:grow .55s ease both}
.li{grid-template-columns:10px 1fr auto;gap:10px;align-items:center}
.li i{width:10px;height:10px;border-radius:3px}
.li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btns{display:flex;gap:8px;margin-top:18px}
.btn{all:unset;flex:1;text-align:center;box-sizing:border-box;padding:9px 12px;border-radius:8px;border:1px solid var(--line);cursor:pointer;font-weight:600;font-size:13px}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{margin:16px 0 0;font-size:13px}
.foot{margin:22px 0 0;font-size:12px;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<div class="app">
  <noscript>This map needs JavaScript enabled.</noscript>
  <h1>World indicators</h1>
  <p class="sub">Select a country to inspect it. Scroll or pinch to zoom, drag to pan.</p>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Metric"></nav>
  <div class="stage">
    <section>
      <div class="map-wrap" id="wrap">
        <svg id="map" viewBox="0 0 960 430" role="img" aria-label="World map colored by the selected metric"></svg>
        <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zrst" aria-label="Reset view">⤢</button></div>
        <div class="tip" id="tip"></div>
        <div class="msg" id="msg">Loading map…</div>
      </div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <p class="foot">Sample data: rounded, approximate figures for illustration. Boundaries from Natural Earth via world-atlas.</p>
</div>

<script>
(function(){
window.__wi=1;
const $=s=>document.querySelector(s);

// Visible error reporting: the page must never sit on "Loading map…" silently.
function fail(why,err){
  if(err)console.error('[world-indicators] '+why,err);
  let m=$('#msg');
  if(!m){m=document.createElement('div');m.id='msg';m.className='msg';$('#wrap').append(m)}
  m.innerHTML='Couldn’t load the map: '+String(why).replace(/</g,'&lt;')+'.<br><a href="">Reload</a>';
}
addEventListener('error',e=>{if($('#msg')&&(/app\.js|data\.js/.test(e.filename||'')||e.filename===location.href.split('#')[0]))fail(e.message||'script error',e.error)});
addEventListener('unhandledrejection',e=>{if($('#msg'))fail((e.reason&&e.reason.message)||String(e.reason),e.reason)});

const tmo=(p,ms,what)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error(what+' timed out')),ms))]);
const load=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('could not load '+u));document.head.append(s)});
async function loadAny(test,urls,label){
  for(const u of urls){if(test())return;try{await tmo(load(u),10000,u)}catch(e){console.warn('[world-indicators] fallback',e.message)}}
  if(!test())throw new Error(label+' library unavailable (blocked or offline)');
}
// d3 and topojson-client: primary tags are in index.html; these are fallbacks.
const libs=async()=>{
  await loadAny(()=>window.d3&&d3.geoNaturalEarth1,['https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js','https://unpkg.com/d3@7.9.0/dist/d3.min.js'],'d3');
  await loadAny(()=>window.topojson&&topojson.feature,['https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js','https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js'],'topojson');
};
// World shapes (world-atlas, Natural Earth). A local copy in data/ is preferred if present.
const SRC=['data/countries-110m.json','https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json','https://unpkg.com/world-atlas@2.0.2/countries-110m.json'];
async function getTopo(){
  for(const u of SRC){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
      const r=await fetch(u,{signal:c.signal});clearTimeout(t);
      if(!r.ok)continue;
      const j=await r.json();
      if(j&&j.objects&&j.objects.countries)return j;
    }catch(e){console.warn('[world-indicators] map data source failed',u,e&&e.message)}
  }
  throw new Error('map data unavailable');
}

async function main(){
await libs();
const topo=await getTopo();
const W=960,H=430;
const R={n:'North America',s:'South America',e:'Europe',a:'Asia',f:'Africa',o:'Oceania'};
const NM={USA:'United States',COD:'DR Congo',COG:'Republic of the Congo',TZA:'Tanzania',SRB:'Serbia',MKD:'North Macedonia',SWZ:'Eswatini',BIH:'Bosnia and Herzegovina',CIV:'Côte d’Ivoire',DOM:'Dominican Republic'};
const tidy=n=>n.replace(/\bDem\./,'Democratic').replace(/\bRep\./,'Republic').replace(/\bEq\./,'Equatorial').replace(/\bIs\./,'Islands').replace(/^S\. /,'South ').replace(/^W\. /,'Western ').replace(/^N\. /,'Northern ').replace(/^Fr\. /,'French ');
// ISO3:region,population (m),GDP per capita (US$ k),life expectancy (yrs),internet users (%),CO2 per person (t)
const RAW=window.WORLD_DATA,N2A=window.WORLD_IDS;
if(!RAW||!N2A)throw new Error('data files (js/data.js) did not load');
const D=new Map(RAW.split('\n').map(l=>{const[i,v]=l.split(':'),[r,...x]=v.split(',');return[i,{r,pop:+x[0],gdp:+x[1],life:+x[2],net:+x[3],co2:+x[4]}]}));
const pal=f=>d3.quantize(t=>f(.2+.7*t),6);
const nf=v=>v>=1000?(v/1000).toFixed(1)+'bn':v>=10?''+Math.round(v):''+ +v.toFixed(1);
const MT=[
{k:'life',name:'Life expectancy',unit:'years at birth',c:pal(d3.interpolateYlGn),fmt:v=>Math.round(v)+' yrs'},
{k:'gdp',name:'GDP per capita',unit:'US$ thousands',c:pal(d3.interpolateBlues),fmt:v=>'$'+nf(v)+'k'},
{k:'net',name:'Internet users',unit:'% of population',c:pal(d3.interpolatePurples),fmt:v=>Math.round(v)+'%'},
{k:'co2',name:'CO₂ per person',unit:'tonnes per year',c:pal(d3.interpolateOrRd),fmt:v=>v.toFixed(1)+' t'},
{k:'pop',name:'Population',unit:'millions',c:pal(d3.interpolateYlOrBr),fmt:v=>nf(v)+(v>=1000?'':' m')}];
let M=MT[0],mi=0,sel=null,lock=null,bins=[],ranked=[],drag=false,touch=false,tt;
const S={};

const rev=c=>c.map(r=>r.slice().reverse());
const feats=topojson.feature(topo,topo.objects.countries).features.filter(f=>String(f.id)!=='010'&&f.geometry).map((f,i)=>{
  if(d3.geoArea(f)>6.3){const g=f.geometry;g.coordinates=g.type==='Polygon'?rev(g.coordinates):g.coordinates.map(rev)}
  f._i=i;f.a3=N2A[String(f.id).padStart(3,'0')];f.d=D.get(f.a3);return f});
const rows=feats.filter(f=>f.d);
MT.forEach(m=>S[m.k]=rows.map(f=>f.d[m.k]).sort(d3.ascending));
const rankOf=(k,v)=>S[k].length-d3.bisectRight(S[k],v)+1;
const name=f=>NM[f.a3]||tidy(f.properties.name||'Unknown');

const svg=d3.select('#map'),tip=$('#tip'),wrap=$('#wrap'),P=$('#panel'),L=$('#legend');
svg.append('rect').attr('class','ocean').attr('width',W).attr('height',H).on('click',()=>select(null));
const proj=d3.geoNaturalEarth1().fitExtent([[10,14],[W-10,H-14]],{type:'FeatureCollection',features:feats});
const path=d3.geoPath(proj),view=svg.append('g');
const paths=view.append('g').attr('class','cs').selectAll('path').data(feats).join('path').attr('d',path);
const hov=view.append('path').attr('class','hov'),selP=view.append('path').attr('class','selp');
$('#msg').remove();

const zoom=d3.zoom().scaleExtent([1,14]).extent([[0,0],[W,H]]).translateExtent([[0,0],[W,H]])
  .on('start',()=>{drag=true;hideTip();hover(null)})
  .on('zoom',e=>view.attr('transform',e.transform))
  .on('end',()=>{drag=false});
svg.call(zoom);
const by=k=>svg.transition().duration(300).call(zoom.scaleBy,k);
$('#zin').onclick=()=>by(1.8);
$('#zout').onclick=()=>by(1/1.8);
$('#zrst').onclick=()=>svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity);
function zoomTo(f){
  const[[a,b],[c,e]]=path.bounds(f),k=Math.max(1,Math.min(9,.72/Math.max((c-a)/W,(e-b)/H)));
  const t=zoom.constrain()(d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(a+c)/2,-(b+e)/2),[[0,0],[W,H]],[[0,0],[W,H]]);
  svg.transition().duration(800).ease(d3.easeCubicInOut).call(zoom.transform,t);
}

const hover=f=>hov.attr('d',f?path(f):null);
const hideTip=()=>tip.classList.remove('show');
function showTip(e,f){
  if(drag||(touch&&e.type!=='click'))return;
  const d=f.d;
  tip.innerHTML=`<b>${name(f)}</b>`+(d?`<span><i style="background:${M.c[f._b]}"></i><strong>${M.fmt(d[M.k])}</strong><em>rank ${rankOf(M.k,d[M.k])} of ${S[M.k].length}</em></span>`:'<span>No data</span>');
  const r=wrap.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX-r.left+14,y=e.clientY-r.top+16;
  if(x+w>r.width-6)x-=w+28;
  if(y+h>r.height-6)y-=h+32;
  tip.style.transform=`translate(${Math.max(6,x)}px,${Math.max(6,y)}px)`;
  tip.classList.add('show');
}
addEventListener('pointerdown',e=>{touch=e.pointerType!=='mouse'},true);
paths.on('pointerenter',(e,f)=>{if(touch||drag)return;hover(f);showTip(e,f)})
  .on('pointermove',(e,f)=>showTip(e,f))
  .on('pointerleave',()=>{hover(null);hideTip()})
  .on('click',(e,f)=>{select(f);if(touch){showTip(e,f);clearTimeout(tt);tt=setTimeout(hideTip,2600)}});
addEventListener('keydown',e=>{if(e.key==='Escape')select(null)});

function select(f){sel=f;selP.attr('d',f?path(f):null);panel()}

function paint(){paths.style('fill',f=>{const d=f.d;if(!d){f._b=-1;return null}f._b=d3.bisectRight(bins,d[M.k]);return M.c[f._b]})}
function legend(){
  const s=S[M.k],e=[s[0],...bins,s[s.length-1]];
  L.innerHTML=`<div class="lgh"><span><b>${M.name}</b><em>${M.unit}</em></span><span class="nd"><i></i>No data</span></div><div class="lg">${M.c.map((c,i)=>`<button data-i="${i}" aria-label="Highlight ${nf(e[i])} to ${nf(e[i+1])}"><i style="background:${c}"></i><small>${nf(e[i])}–${nf(e[i+1])}</small></button>`).join('')}</div>`;
}
function focusBin(i){
  paths.classed('dim',f=>i!=null&&f._b!==i);
  L.querySelector('.lg').classList.toggle('f',i!=null);
  L.querySelectorAll('.lg button').forEach((b,j)=>b.classList.toggle('on',j===i));
}
L.onpointerover=e=>{if(e.pointerType==='mouse'){const b=e.target.closest('[data-i]');if(b)focusBin(+b.dataset.i)}};
L.onpointerleave=()=>focusBin(lock);
L.onclick=e=>{const b=e.target.closest('[data-i]');if(b){const i=+b.dataset.i;lock=lock===i?null:i;focusBin(lock)}};

function panel(){
  const btns=`<div class="btns"><button class="btn p" data-a="zoom">Zoom to country</button><button class="btn" data-a="clear">Clear</button></div>`;
  if(!sel){
    const s=S[M.k],li=f=>`<button class="li" data-f="${f._i}"><i style="background:${M.c[f._b]}"></i><span>${name(f)}</span><b>${M.fmt(f.d[M.k])}</b></button>`;
    P.innerHTML=`<div class="fade"><div class="kick">Global overview</div><h2>${M.name}</h2><p class="mute" style="margin:0">Median ${M.fmt(d3.median(s))} across ${s.length} countries in the sample.</p>
    <div class="sec">Highest</div>${ranked.slice(0,5).map(li).join('')}<div class="sec">Lowest</div>${ranked.slice(-5).reverse().map(li).join('')}
    <p class="hint mute">Pick a country above or select one on the map for its full profile.</p></div>`;
    return;
  }
  const d=sel.d,nm=name(sel);
  if(!d){P.innerHTML=`<div class="fade"><div class="kick">No data</div><h2>${nm}</h2><p class="mute">This country isn’t in the sample dataset.</p>${btns}</div>`;return}
  const v=d[M.k],n=S[M.k].length,r=rankOf(M.k,v),med=d3.median(S[M.k]),pos=(1-(r-1)/(n-1))*100;
  const list=MT.map((m,j)=>{const x=d[m.k],p=1-(rankOf(m.k,x)-1)/(S[m.k].length-1);
    return `<button class="row${j===mi?' on':''}" data-m="${j}"><span>${m.name}</span><b>${m.fmt(x)}</b><span class="bar"><span style="width:${Math.max(4,p*100)}%;background:${m.c[4]}"></span></span></button>`}).join('');
  P.innerHTML=`<div class="fade"><div class="kick">${R[d.r]}</div><h2>${nm}</h2>
  <div class="hero"><i style="background:${M.c[sel._b]}"></i><div><b>${M.fmt(v)}</b><small>${M.name}, rank ${r} of ${n}</small></div></div>
  <div class="scale">${M.c.map(c=>`<i style="background:${c}"></i>`).join('')}<span class="mk" style="left:${pos}%"></span></div>
  <div class="scl"><span>Lowest</span><span>${v>=med?'Above':'Below'} the median of ${M.fmt(med)}</span><span>Highest</span></div>
  <div class="sec">All indicators</div>${list}${btns}</div>`;
}
P.onclick=e=>{
  const b=e.target.closest('[data-m],[data-f],[data-a]');if(!b)return;const k=b.dataset;
  if(k.m!=null)setMetric(+k.m);
  else if(k.f!=null){const f=feats[+k.f];select(f);zoomTo(f)}
  else if(k.a==='zoom')zoomTo(sel);
  else select(null);
};

$('#tabs').innerHTML=MT.map((m,i)=>`<button class="tab" role="tab" data-m="${i}" style="--c:${m.c[4]}">${m.name}</button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('[data-m]');if(b){setMetric(+b.dataset.m);b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}};

function setMetric(i){
  mi=i;M=MT[i];lock=null;
  bins=d3.scaleQuantile().domain(S[M.k]).range(M.c).quantiles();
  ranked=rows.slice().sort((a,b)=>b.d[M.k]-a.d[M.k]);
  paint();legend();focusBin(null);
  document.querySelectorAll('.tab').forEach((t,j)=>t.setAttribute('aria-selected',j===i));
  panel();
}
requestAnimationFrame(()=>requestAnimationFrame(()=>setMetric(0)));
}
main().catch(e=>fail((e&&e.message)||'unexpected error',e));
})();
</script>
<script>window.__end=1</script>
</body>
</html>
